<title>2026 Outreach Grant — Applications Dashboard</title>
<style>
  :root{--ink:#14243d;--ink2:#42546f;--ink3:#6f7e93;--paper:#fff;--desk:#eceff3;--rule:#c9d0d9;--mark:#a3232c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--desk);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--paper);border:1px solid var(--rule);max-width:380px;width:100%;padding:32px 28px;box-shadow:0 2px 10px rgba(20,36,61,.08)}

  .pweye{position:absolute;right:0;top:0;bottom:0;width:38px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);cursor:pointer}
  .pweye:hover{color:var(--ink)}
  .pweye svg{pointer-events:none}
  button[type=submit]{width:100%;font:inherit;font-size:14px;font-weight:600;padding:10px;border:0;border-radius:2px;background:var(--ink);color:#fff;cursor:pointer}
  button[type=submit]:hover{background:#1d3453}
  .err{color:var(--mark);font-size:13px;min-height:18px;margin-top:10px}
</style>

          <circle cx="12" cy="12" r="3"/>

const ITERATIONS = 250000;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryUnlock(password) {

  const salt = all.slice(0, 16);
  const iv = all.slice(16, 28);
  const data = all.slice(28);

  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  const html = new TextDecoder().decode(plainBuf);
  document.open();
  document.write(html);
  document.close();
}

const EYE = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-4.22 5.5M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>';

document.getElementById('pweye').addEventListener('click', () => {
  const pw = document.getElementById('pw');
  const icon = document.getElementById('eyeIcon');
  const btn = document.getElementById('pweye');
  const showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  icon.innerHTML = showing ? EYE : EYE_OFF;
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  btn.setAttribute('aria-pressed', String(!showing));
  pw.focus();
});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    await tryUnlock(pw);
  } catch (err) {
    errEl.textContent = 'Incorrect password.';
  }
});
</script>
